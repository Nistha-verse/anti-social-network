<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f0" />
    <title>The Anti-Social Network</title>
  </head>
  <body>
    <div id="root"><main id="boot-screen" style="max-width:720px;margin:80px auto;padding:24px;font:16px system-ui;color:#322b38"><strong>Opening the Anti-Social Network…</strong></main></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root || !event.error) return;
        var main = document.createElement('main');
        main.style.cssText = 'max-width:720px;margin:80px auto;padding:24px;font:16px system-ui;color:#322b38';
        var heading = document.createElement('h1');
        heading.textContent = 'The app hit a browser error.';
        var detail = document.createElement('pre');
        detail.style.cssText = 'white-space:pre-wrap;padding:16px;border-radius:12px;background:#fff1f3;color:#9e4058';
        detail.textContent = String(event.error.message || event.message);
        main.append(heading, detail);
        root.replaceChildren(main);
      });
      window.addEventListener('unhandledrejection', function (event) {
        console.error('Anti-Social Network promise error', event.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
